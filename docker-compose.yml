services:
  ollama:
    image: ollama/ollama:latest
    container_name: ti-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  collector:
    build: .
    container_name: ti-collector
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      VAULT_PATH: /app/vault
      DATABASE_PATH: /app/database/tech_intelligence.db
    volumes:
      - ./vault:/app/vault
      # DB en volumen Docker (NO en bind mount): OneDrive corrompe SQLite
      - ti_data:/app/database
      - ./config:/app/config
      - ./logs:/app/logs
    command: ["scheduler"]

volumes:
  ollama_data:
  ti_data: