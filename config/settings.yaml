# ============================================================
# Tech Intelligence — configuración general
# Los valores de entorno (.env) tienen prioridad sobre estos.
# ============================================================

settings:
  # Backend de IA: ollama (local, privado) | openrouter (cloud, con web search si el modelo es :online)
  ai:
    backend: openrouter
    # Solo para backend openrouter:
    openrouter_api_key: ""
    openrouter_model: "nvidia/nemotron-3.5-lightning:free"
    # Varios modelos: se rotan en cada llamada y hay failover si uno da rate limit
    openrouter_models:
      - "nvidia/nemotron-3.5-lightning:free"
      - "google/gemma-4-26b-a4b-it:free"
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
    openrouter_timeout: 180

  ollama:
    base_url: http://localhost:11434
    model: llama3.2:1b
    timeout: 300
    temperature: 0.1

  vault_path: ./vault
  database_path: ./database/tech_intelligence.db
  log_dir: ./logs
  log_level: INFO

  # Scheduler: minutos entre ciclos completos
  sync_interval: 60

  # Procesamiento
  max_processing_attempts: 3
  long_content_chars: 15000  # contenido más largo -> Inbox/Sources
  processing_workers: 3      # artículos procesados en paralelo
  # Añade un worker extra con Ollama local (llama3.2:1b) en paralelo a OpenRouter
  hybrid_ollama: true

  # Git
  git_enabled: true
  git_commit_prefix: "tech-intelligence: sync"